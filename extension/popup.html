<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Khan Kiddo</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, sans-serif; color: #18243b; background: #f5f7fc; }
    * { box-sizing: border-box; }
    body { margin: 0; width: 372px; padding: 16px 16px 12px; }
    h2 { margin: 0; font-size: 17px; letter-spacing: -.4px; }
    .section-head {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      margin-bottom: 10px;
    }
    .task-badge {
      margin: 0; flex-shrink: 0; font-size: 11px; font-weight: 650; line-height: 1.3;
      color: #647189; max-width: 46%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .task-badge:empty { display: none; }
    .task-badge.is-done { color: #26704c; }
    .task-badge.is-running { color: #9a6b12; }
    .task-badge.is-failed { color: #ad3152; }
    p { margin: 0; font-size: 12px; line-height: 1.55; color: #647189; }
    .card { background: white; border: 1px solid #e1e6f0; border-radius: 14px; padding: 14px; margin-bottom: 10px; }
    .history-card { border-color: #d7def4; }
    .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    button { border: 1px solid transparent; border-radius: 10px; padding: 9px 12px; font: inherit; font-size: 12px; font-weight: 650; cursor: pointer; }
    button.primary { background: #223b91; color: white; flex: 1; }
    button.primary:hover { background: #172b75; }
    button.secondary { background: #f1f4fa; color: #42516c; border-color: #e5eaf3; }
    button.ghost { background: transparent; color: #53617b; border-color: transparent; padding: 6px 8px; font-weight: 600; font-size: 11px; }
    button:disabled { opacity: .45; cursor: default; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid #6685df; outline-offset: 3px; }
    .hidden { display: none !important; }
    .status { font-size: 12px; line-height: 1.55; color: #53617b; overflow-wrap: anywhere; }
    .status:not(:empty) { margin-top: 10px; }
    .status.error { color: #ad3152; }
    .status.ok { color: #26704c; }
    .transcript {
      margin: 10px 0 0; padding: 10px; max-height: 220px; overflow: auto; white-space: pre-wrap;
      user-select: text; overflow-wrap: anywhere; background: #f7f9fd; border: 1px solid #e8edf5;
      border-radius: 10px; font: 12px/1.65 system-ui, sans-serif;
    }
    .transcript:empty { display: none; }
    details.card { padding: 0; }
    summary { padding: 12px 14px; cursor: pointer; font-size: 12px; font-weight: 600; color: #53617b; }
    .details-body { padding: 0 14px 14px; }
    label { display: block; margin-bottom: 6px; font-size: 12px; color: #53617b; }
    input[type="url"], textarea {
      width: 100%; border: 1px solid #dce3ef; border-radius: 9px; padding: 9px;
      font: inherit; font-size: 12px; line-height: 1.5; background: #fafbfe; color: #18243b;
    }
    textarea { min-height: 64px; resize: vertical; }
    .privacy-consent { display: flex; align-items: center; gap: 7px; margin: 10px 0 0; font-size: 11px; line-height: 1.45; }
    .privacy-consent input { margin: 0; accent-color: #223b91; }
    a { color: #5064a6; text-underline-offset: 3px; }
    .settings { margin-top: 12px; }
    .settings summary { padding: 4px 0; font-size: 11px; font-weight: 400; }
    .settings .row { margin-top: 8px; }
    footer {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 6px 2px 0; font-size: 11px; color: #7b8598;
    }
    .footer-account {
      display: flex; align-items: center; gap: 4px; min-width: 0; justify-content: flex-end;
    }
    .footer-account .chip {
      margin: 0; font-size: 11px; line-height: 1.3; color: #26704c; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; max-width: 120px;
    }
    .footer-account .chip.error { color: #ad3152; }
    .footer-account .chip:empty { display: none; }
  </style>
</head>
<body>
  <section id="accountSection" class="card" aria-labelledby="accountTitle">
    <h2 id="accountTitle">连接账号</h2>
    <p id="accountHint">连接后可将 ChatGPT 对话提交到 Khan Kiddo 分析。</p>
    <p id="accountStatusHero" class="status" role="status" aria-live="polite"></p>
    <div class="actions">
      <button id="connectBtn" class="primary hidden" type="button">连接账号</button>
    </div>
  </section>

  <section id="historySection" class="card history-card hidden" aria-labelledby="historyTitle">
    <div class="section-head">
      <h2 id="historyTitle">当前对话</h2>
      <p id="historyTaskBadge" class="task-badge" role="status" aria-live="polite"></p>
    </div>
    <div class="actions">
      <button id="analyzeHistory" class="primary" type="button">一键分析</button>
      <button id="copyHistory" class="secondary" type="button" disabled>复制</button>
    </div>
    <p id="historyStatus" class="status" role="status" aria-live="polite"></p>
    <pre id="historyText" class="transcript" aria-label="读取的对话内容"></pre>
  </section>

  <section id="dailyPracticeSection" class="card hidden" aria-labelledby="dailyPracticeTitle">
    <h2 id="dailyPracticeTitle">今日练习</h2>
    <p id="dailyPracticeSummary"></p>
    <div class="actions">
      <button id="dailyPracticeInject" class="primary" type="button" disabled>注入到输入框</button>
      <button id="dailyPracticeRefresh" class="secondary" type="button">换一组</button>
    </div>
    <p id="dailyPracticeStatus" class="status" role="status" aria-live="polite"></p>
  </section>

  <details id="shareSection" class="card">
    <summary>分享链接导入</summary>
    <div class="details-body">
      <label for="shareUrl">ChatGPT 分享链接</label>
      <textarea id="shareUrl" placeholder="https://chatgpt.com/share/..." spellcheck="false"></textarea>
      <label class="privacy-consent" for="privacyConsent">
        <input id="privacyConsent" type="checkbox"/>
        <span>同意<a href="https://khankiddo.top/privacy/extension" target="_blank" rel="noreferrer">隐私政策</a></span>
      </label>
      <div class="actions"><button id="importBtn" class="secondary" type="button">导入并打开分析页</button></div>
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <details id="originRow" class="settings hidden">
        <summary>开发设置</summary>
        <div class="row"><label for="webOrigin">分析站点地址</label><input id="webOrigin" type="url" placeholder="http://localhost:5173" spellcheck="false"/></div>
        <div class="actions"><button id="saveBtn" class="secondary hidden" type="button">保存设置</button></div>
      </details>
    </div>
  </details>
  <footer>
    <a href="https://khankiddo.top/privacy/extension" target="_blank" rel="noreferrer">隐私政策</a>
    <div id="footerAccount" class="footer-account" aria-live="polite">
      <span id="accountStatus" class="chip"></span>
      <button id="disconnectBtn" class="ghost hidden" type="button">断开</button>
    </div>
  </footer>
  <script type="module" src="/src/popup/main.ts"></script>
</body>
</html>
